[package]
name = "refract_core"
version = "1.7.1"
license = "WTFPL"
authors = ["Josh Stoik <josh@blobfolio.com>"]
edition = "2024"
description = "The library for Refract."
repository = "https://github.com/Blobfolio/refract"
readme = "README.md"
publish = false

[dependencies]
dactyl =         { workspace = true, optional = true }
fyi_ansi =       { workspace = true }
jpeg-decoder =   { workspace = true, optional = true }
jpegxl-sys =     { workspace = true, features = ["vendored"], optional = true }
libavif-sys =    { workspace = true, features = ["codec-aom"], optional = true }
libwebp-sys =    { workspace = true, features = ["std"], optional = true }
link-cplusplus = { workspace = true, optional = true }
lodepng =        { workspace = true, features = ["zlibrs"], optional = true }
rgb =            { workspace = true, features = ["bytemuck"], optional = true }

[features]
default = [ "images" ]

# Enable all image formats.
images = [ "jpeg", "png", "avif", "jxl", "webp" ]

# Support AVIF.
avif = [ "dactyl", "libavif-sys" ]

# Support JPEG (decode-only).
jpeg = [ "jpeg-decoder", "rgb" ]

# Support JPEG-XL.
jxl = [ "dactyl", "jpegxl-sys", "link-cplusplus" ]

# Support PNG (decode-only).
png = [ "lodepng" ]

# Support WebP.
webp = [ "dactyl", "libwebp-sys" ]
